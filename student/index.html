<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>背单词闯关</title>
<style>
:root{
  --ink:#1f2d2b;--sub:#6c7b78;--line:#e2ebe6;--bg:#f4f7f4;--card:#fff;
  --go:#2f7d62;--go-soft:#dff0e7;--warn:#b06a3f;--warn-soft:#fbeadf;--bad:#a8514c;--bad-soft:#f8e3e1;
  --gold:#f2c14e;--shadow:0 10px 30px rgba(31,45,43,.09);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
h1{font-size:25px;line-height:1.25;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 10px}
p{margin:0 0 10px}
.sub{color:var(--sub);font-size:14px}
.eyebrow{color:var(--go);font-size:12px;font-weight:700;letter-spacing:.1em;margin:0 0 8px}
button{font:inherit;cursor:pointer;border:none;border-radius:13px;padding:13px 18px;background:var(--go);color:#fff;font-weight:600;width:100%}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
button.small{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
button:disabled{opacity:.45;cursor:not-allowed}
select{font:inherit;font-size:17px;width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;color:var(--ink);appearance:none}
input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;color:var(--ink)}
input{font-size:17px}
textarea{min-height:84px;resize:vertical;font-size:16px}
label{display:block;font-size:14px;color:var(--sub);margin-bottom:7px}
.row{display:flex;gap:9px}.row>*{flex:1}
.hide{display:none!important}

/* 进度条 */
.bar{display:flex;gap:5px;margin-bottom:14px}
.seg{flex:1;height:6px;border-radius:99px;background:#e4ece8}
.seg.on{background:var(--go)}.seg.now{background:var(--gold)}

/* 剧情 */
.scene{background:linear-gradient(160deg,#20332f,#2f4a43);color:#eef5f1;border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.scene .meta{font-size:12px;color:#9fc3b5;letter-spacing:.08em;margin-bottom:9px}
.scene h2{color:#fff;font-size:20px;margin-bottom:12px}
.scene p{color:#dbe9e2;font-size:15.5px;margin:0}
.cliff{margin-top:16px;padding:13px 15px;background:rgba(242,193,78,.16);border-left:3px solid var(--gold);border-radius:10px;color:#f6e3b4;font-size:14.5px}
.locked{display:flex;align-items:center;gap:8px;color:#9fc3b5;font-size:13px;margin-top:14px}

/* 题 */
.q{border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px}
.q .zh{font-size:17px;font-weight:600;margin-bottom:4px}
.q .tip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sub);font-size:13px;letter-spacing:.14em;margin-bottom:10px}
.q .ctx{font-size:16px;margin-bottom:6px}
.q .ctx u{text-decoration:none;border-bottom:2px solid var(--gold);padding:0 22px}
.q .wrongline{font-size:16px;color:var(--bad);margin-bottom:6px;text-decoration:line-through;text-decoration-color:#d9b3b0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0}
.opt{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-size:15px;width:auto;color:var(--ink);font-weight:500}
.opt.pick{background:var(--ink);color:#fff;border-color:var(--ink)}
.fb{font-size:14px;margin-top:9px;font-weight:600}
.fb.pass{color:var(--go)}.fb.near{color:var(--warn)}.fb.fail{color:var(--bad)}
.fb .ans{display:block;font-weight:500;color:var(--sub);margin-top:3px}
.q.pass{background:var(--go-soft);border-color:#bfe0d1}
.q.near{background:var(--warn-soft);border-color:#eccdb6}
.q.fail{background:var(--bad-soft);border-color:#e9c4c1}

/* 结算 */
.score{display:flex;gap:9px;margin:4px 0 14px}
.score div{flex:1;text-align:center;border-radius:14px;padding:13px 6px;border:1px solid var(--line)}
.score b{display:block;font-size:27px;line-height:1.1}
.score span{font-size:12px;color:var(--sub)}
.score .p{background:var(--go-soft);border-color:#bfe0d1}.score .p b{color:var(--go)}
.score .n{background:var(--warn-soft);border-color:#eccdb6}.score .n b{color:var(--warn)}
.score .f{background:var(--bad-soft);border-color:#e9c4c1}.score .f b{color:var(--bad)}
.score .r{background:#f4f6fb;border-color:#ccd6e6}.score .r b{color:#5b6b85}
.lst{font-size:14px;color:var(--sub);margin:0 0 14px;padding-left:18px}
.lst li{margin-bottom:4px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:#f7faf8;border:1px solid var(--line);border-radius:11px;padding:12px;color:#495855;max-height:110px;overflow:auto}
.note{font-size:13px;color:var(--sub);background:#f7faf8;border-radius:11px;padding:11px 13px;margin-top:11px}
.ok{color:var(--go);font-size:14px;font-weight:600;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 开场 -->
  <section id="v-start" class="card">
    <p class="eyebrow" id="s-src">背单词闯关</p>
    <h1 id="s-title">—</h1>
    <p class="sub" id="s-sub">—</p>
    <div style="margin:16px 0 4px">
      <label for="name" id="name-label">写下你的名字（老师会看到）</label>
      <select id="pick" class="hide"></select>
      <input id="name" placeholder="例如：王小明" autocomplete="off">
    </div>
    <p class="sub" id="s-cls" style="margin:9px 0 0"></p>
    <p class="sub" id="s-resume" style="margin:10px 0 0"></p>
    <div style="margin-top:14px"><button id="btn-start">开始</button></div>
    <div class="note" id="s-note">看一段剧，卡住的地方过几个词，就能看下一段。全部通关后，点「交作业」把结果交给老师。</div>
  </section>

  <!-- 剧情 -->
  <section id="v-scene" class="hide">
    <div class="bar" id="bar"></div>
    <div class="scene">
      <div class="meta" id="sc-meta">—</div>
      <h2 id="sc-title">—</h2>
      <p id="sc-text">—</p>
      <div class="cliff hide" id="sc-cliff"></div>
      <div class="locked" id="sc-locked">🔒 下一幕还没解锁</div>
    </div>
    <button id="btn-go">过关，解锁下一幕</button>
  </section>

  <!-- 关卡 -->
  <section id="v-level" class="hide">
    <div class="bar" id="bar2"></div>
    <div class="card">
      <p class="eyebrow" id="lv-kind">—</p>
      <h2 id="lv-title">—</h2>
      <p class="sub" id="lv-need">—</p>
    </div>
    <div id="qs"></div>
    <div class="card">
      <button id="btn-check">提交这一关</button>
      <div class="ok" id="lv-msg"></div>
      <div class="row hide" id="lv-after" style="margin-top:10px">
        <button class="ghost" id="btn-again">错的再来一次</button>
        <button id="btn-next">继续</button>
      </div>
    </div>
  </section>

  <!-- 结算 -->
  <section id="v-done" class="hide">
    <div class="card">
      <p class="eyebrow">全部通关</p>
      <h1 id="d-title">辛苦了</h1>
      <p class="sub" id="d-sub">—</p>
      <div class="score">
        <div class="p"><b id="d-pass">0</b><span>背对了</span></div>
        <div class="n"><b id="d-near">0</b><span>差一点</span></div>
        <div class="f"><b id="d-fail">0</b><span>还不会</span></div>
        <div class="r"><b id="d-review">0</b><span>待老师看</span></div>
      </div>
      <div id="d-wrongbox">
        <p class="sub" style="margin-bottom:6px">下次会先给你这些：</p>
        <ul class="lst" id="d-wrong"></ul>
      </div>
      <label for="self">你自己觉得这些背得怎么样？</label>
      <div class="opts" id="self-opts">
        <button class="opt" data-self="会了">会了</button>
        <button class="opt" data-self="不太稳">不太稳</button>
        <button class="opt" data-self="我还不会">我还不会</button>
      </div>
    </div>

    <div class="card">
      <h2>交作业</h2>
      <p class="sub" id="d-how">点下面的按钮，成绩会自动填好，你只要按一下提交。</p>
      <button id="btn-submit">交作业给老师</button>
      <div class="ok" id="d-msg"></div>
      <div style="margin-top:12px">
        <p class="sub" style="margin-bottom:6px">交不上去就用这个：复制下面这串，发到群里给老师。</p>
        <div class="code" id="d-code">—</div>
        <div class="row" style="margin-top:9px">
          <button class="ghost small" id="btn-copy">复制结果码</button>
          <button class="ghost small" id="btn-retry">再练一遍</button>
        </div>
      </div>
      <div class="note">造句题由老师本人看，系统不替老师判对错。文字背对了，也还不等于能开口说出来。</div>
    </div>
  </section>

</div>

<script>
/* ===== 内容包：发布时由 WorkBuddy skill 注入，这里是可直接打开的样例 ===== */
const PACK = /*__PACK_START__*/{
  "packId":"DEMO","schema":"beike-pack/1","title":"Unit 1 People of Achievement","subtitle":"人教版 · 选择性必修第一册",
  "source":{"from":"样例内容包","note":"真实发布时由 WorkBuddy 从课本词表自动生成"},
  "cls":"",
  "rosters":{"高一3班":["王小明","李思远","张嘉怡","陈默"],"高一4班":["赵一诺","周沐","吴星遥"],"高一5班":["郑听雨","林知夏","王小明"]},
  "submit":{"formUrl":"","fieldMap":{"cls":"班级","student":"姓名","packId":"内容包","attempt":"第几次","right":"对了","shaky":"差一点","nope":"还不会","toTeacher":"待老师看","nopeList":"还不会清单","shakyList":"差一点清单","composeText":"造句原文","selfRating":"自评","durationSec":"用时秒","tooFast":"用时偏短","detail":"明细"}},
  "episode":{"title":"一株青蒿","tagline":"1969 年，一个没有名字的实验室，和 191 次失败。","scenes":[
    {"id":"S1","label":"第 1 幕","time":"00:00–01:30","text":"北京，1969 年 1 月。39 岁的她接到一个任务：找到能治疟疾的药。实验室里没有空调，没有通风柜，只有 2000 多张古方抄纸。同事问她：这事做不成怎么办？她说：那就先做。","cliff":"她翻开的第一本书里写了什么？先过 5 个词，下一幕解锁。"},
    {"id":"S2","label":"第 2 幕","time":"01:30–03:10","text":"《肘后备急方》里有一句：青蒿一握，以水二升渍，绞取汁，尽服之。她盯住了「绞取汁」三个字——不是煮，是冷取。前面 190 次失败，可能只是因为温度太高。","cliff":"她改了方法，然后把药用在了谁身上？填对情境里的空，继续看。"},
    {"id":"S3","label":"第 3 幕","time":"03:10–05:00","text":"1972 年，第 191 号样本有效率 100%。但没人敢用在病人身上。她在申请书上写下自己的名字，成为第一个试药的人。住院一周，她活着出来了。","cliff":"用这一幕里的词，自己讲一句靠谱的话，才能看结局。"},
    {"id":"S4","label":"第 4 幕","time":"05:00–06:40","text":"2015 年 10 月 5 日，斯德哥尔摩。诺贝尔生理学或医学奖。她在台上说：这不是我一个人的荣誉。青蒿素挽救的生命，已经超过 600 万。","cliff":"最后一关：把别人写错的句子改对，并说清为什么错。"},
    {"id":"S5","label":"结局","time":"06:40–07:20","text":"她至今住在北京一套普通的房子里。墙上没有奖状。有人问她最想被记住什么，她说：青蒿素是中药给世界的一份礼物。","cliff":""}
  ]},
  "levels":[
    {"id":"L1","sceneId":"S1","type":"flash","title":"闪认 · 看中文拼英文","pass":4,"items":["W-001","W-002","W-003","W-004","W-005"]},
    {"id":"L2","sceneId":"S2","type":"cloze","title":"情境填空 · 把词放回剧情","pass":2,"items":["C-001","C-002","C-003"]},
    {"id":"L3","sceneId":"S3","type":"compose","title":"造句 · 用这些词讲一句靠谱的话","pass":1,"items":["P-001"]},
    {"id":"L4","sceneId":"S4","type":"fix","title":"改错 · 改对，并说清为什么","pass":2,"items":["E-001","E-002","E-003"]},
    {"id":"L5","sceneId":"S5","type":"recall","title":"默写 · 作文里能直接用的句子","pass":1,"items":["S-001","S-002"]}
  ],
  "items":{
    "W-001":{"type":"word","zh":"成就；功绩","en":"achievement","accept":["achievement","achievements"],"hint":"ach_______t"},
    "W-002":{"type":"word","zh":"致力于；献身于","en":"devote to","accept":["devote to","devote oneself to","devote","dedicate to"],"hint":"d_____ to"},
    "W-003":{"type":"word","zh":"内科医生","en":"physician","accept":["physician","physicians"],"hint":"phy______n"},
    "W-004":{"type":"word","zh":"疟疾","en":"malaria","accept":["malaria"],"hint":"mal____a"},
    "W-005":{"type":"word","zh":"提取；提取物","en":"extract","accept":["extract","extracts","extracted"],"hint":"ex_____t"},
    "C-001":{"type":"cloze","context":"In 1969, she was asked to ____ herself to finding a cure for malaria.","answer":"devote","accept":["devote"],"options":["devote","defeat","abandon","obtain"],"zh":"1969 年，她被要求致力于寻找治疗疟疾的方法。"},
    "C-002":{"type":"cloze","context":"After 190 failures, she did not ____ the research.","answer":"abandon","accept":["abandon"],"options":["abandon","acknowledge","insist","extract"],"zh":"190 次失败之后，她没有放弃这项研究。"},
    "C-003":{"type":"cloze","context":"She decided to ____ the plant with cool water instead of boiling it.","answer":"extract","accept":["extract"],"options":["extract","conclude","defeat","devote"],"zh":"她决定用冷水提取这种植物，而不是煮沸它。"},
    "P-001":{"type":"compose","prompt":"用 devote 和 achievement，写一句关于屠呦呦的话。要靠谱——讲得通、说得对。","must":["devote","achievement"],"minWords":8,"sample":"She devoted her whole life to medicine, and her achievement saved millions of people."},
    "E-001":{"type":"fix","wrong":"He devote his life to science.","answer":"He devoted his life to science.","accept":["he devoted his life to science"],"reason":"时态","reasons":["时态","词性","搭配","拼写"],"zh":"他把一生献给了科学。"},
    "E-002":{"type":"fix","wrong":"She has devoted herself in finding a new drug.","answer":"She has devoted herself to finding a new drug.","accept":["she has devoted herself to finding a new drug"],"reason":"搭配","reasons":["时态","词性","搭配","拼写"],"zh":"她致力于寻找一种新药。"},
    "E-003":{"type":"fix","wrong":"Her achieve was acknowledged by the world.","answer":"Her achievement was acknowledged by the world.","accept":["her achievement was acknowledged by the world"],"reason":"词性","reasons":["时态","词性","搭配","拼写"],"zh":"她的成就得到了世界的承认。"},
    "S-001":{"type":"sentence","zh":"请默写：他把一生都奉献给了这项事业。","answer":"He devoted his whole life to the cause.","accept":["he devoted his whole life to the cause","he dedicated his whole life to the cause"],"keys":["devoted","to"]},
    "S-002":{"type":"sentence","zh":"请默写：她的成就得到了全世界的承认。","answer":"Her achievement was acknowledged all over the world.","accept":["her achievement was acknowledged all over the world"],"keys":["achievement","acknowledged"]}
  }
}/*__PACK_END__*/;

/* ===== 工具 ===== */
const $=id=>document.getElementById(id);
const show=id=>{["v-start","v-scene","v-level","v-done"].forEach(v=>$(v).classList.toggle("hide",v!==id));window.scrollTo(0,0)};
const norm=s=>(s||"").toLowerCase().trim().replace(/[.,!?;:'"，。！？；：、]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

/* ===== 判定：pass / near / fail，造句走 review ===== */
function judge(item,ans){
  const a=norm(ans);
  if(!a)return{r:"fail",why:"没写"};
  if(item.type==="compose"){
    const words=a.split(" ").filter(Boolean);
    const miss=(item.must||[]).filter(m=>!a.includes(norm(m)));
    if(miss.length)return{r:"fail",why:"没用到 "+miss.join("、")};
    if(words.length<(item.minWords||6))return{r:"near",why:"太短了，再写长一点"};
    return{r:"review",why:"收到，这句交给老师看"};
  }
  const accept=(item.accept||[item.answer||item.en]).map(norm);
  if(accept.includes(a))return{r:"pass",why:"对"};
  if(accept.some(x=>lev(a,x)<=1))return{r:"near",why:"就差一两个字母"};
  if(item.keys&&item.keys.every(k=>a.includes(norm(k))))return{r:"near",why:"关键词对了，整句还差一点"};
  return{r:"fail",why:"还不对"};
}

/* ===== 状态 ===== */
const KEY="beike-"+PACK.packId;
let st=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.packId===PACK.packId)return r}catch(e){}
  return{packId:PACK.packId,name:"",cls:"",sent:0,li:0,stage:"scene",startedAt:0,results:{},self:"",submitted:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

const LV=PACK.levels, SC=PACK.episode.scenes, IT=PACK.items;
const sceneOf=id=>SC.find(s=>s.id===id)||SC[0];
/* 短标签：错题清单、结果码和飞书里都用它，别把整句塞进去 */
function shortOf(id){
  const it=IT[id]||{};
  if(it.type==="word")return it.en||id;
  if(it.type==="cloze")return it.answer||id;
  if(it.type==="compose")return"造句 "+(it.must||[]).join("+");
  if(it.type==="fix")return"改错 "+(it.reason||"")+"·"+String(it.answer||"").split(" ").slice(0,3).join(" ");
  if(it.type==="sentence")return"默写 "+String(it.zh||"").replace(/^请默写：/,"").slice(0,10);
  return id;
}
const KIND={flash:"关卡 · 闪认",cloze:"关卡 · 情境填空",compose:"关卡 · 造句",fix:"关卡 · 改错",recall:"关卡 · 默写"};

/* ===== 开场 ===== */
$("s-title").textContent=PACK.episode.title?`${PACK.episode.title} · ${PACK.title}`:PACK.title;
$("s-sub").textContent=PACK.episode.tagline||PACK.subtitle||"";
$("s-src").textContent=PACK.subtitle||"背单词闯关";
const qp=new URLSearchParams(location.search);
/* 名单按班分组烧进网页，几个班共用一个网页、一个链接。
   学生选的是「自己的名字」，班级跟着名字走 —— 一个字不用打，也选不错班。
   不靠链接分班：飞书托管时页面装在跨域 iframe 里，外层链接的 ?c= 传不进来。
   让学生自己填班级，你会同时收到「高一3班」「高一（3）班」「1703」「三班」。 */
const ROSTERS=(function(){
  const r=Object.assign({},PACK.rosters||{});
  if(!Object.keys(r).length&&(PACK.roster||[]).length)r[PACK.cls||""]=PACK.roster;
  return r;
})();
let CLASSES=Object.keys(ROSTERS).filter(function(c){return (ROSTERS[c]||[]).length});
/* 自己托管时还可以用 ?c= 只显示一个班；飞书上这个参数传不进来，就显示全部。 */
if(qp.get("c")&&CLASSES.indexOf(qp.get("c"))>=0)CLASSES=[qp.get("c")];
const HAS_ROSTER=CLASSES.length>0;
if(!HAS_ROSTER)st.cls=qp.get("c")||PACK.cls||st.cls||"";
if(qp.get("s"))st.name=qp.get("s");
function esc(t){return String(t).replace(/[&<>"]/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]})}
function pickedPair(){
  const v=$("pick").value; if(!v)return null;
  const i=v.split("|"), c=CLASSES[+i[0]];
  return {cls:c, name:ROSTERS[c][+i[1]]};
}
function selectCurrent(){
  const ci=CLASSES.indexOf(st.cls), ni=ci<0?-1:ROSTERS[st.cls].indexOf(st.name);
  $("pick").value=(ci>=0&&ni>=0)?ci+"|"+ni:"";
  $("s-cls").textContent=(ci>=0&&ni>=0)?st.cls:(CLASSES.length===1?CLASSES[0]:"");
}
if(HAS_ROSTER){
  $("name").classList.add("hide");
  const sel=$("pick"); sel.classList.remove("hide");
  const opt=function(ci){return ROSTERS[CLASSES[ci]].map(function(n,ni){
    return '<option value="'+ci+"|"+ni+'">'+esc(n)+"</option>"}).join("")};
  sel.innerHTML='<option value="">— 在名单里找到你自己 —</option>'+
    (CLASSES.length===1?opt(0):CLASSES.map(function(c,ci){
      return '<optgroup label="'+esc(c)+'">'+opt(ci)+"</optgroup>"}).join(""));
  sel.onchange=function(){const p=pickedPair();$("s-cls").textContent=p?p.cls:""};
  $("name-label").textContent=CLASSES.length>1?"你是哪个班的谁？（老师会看到）":"你是哪位？（老师会看到）";
  selectCurrent();
}else{
  $("s-cls").textContent=st.cls||"";
}
$("name").value=st.name||"";
if(st.li>0||st.stage!=="scene")$("s-resume").textContent=`上次你做到第 ${st.li+1} 关，点开始接着做。`;

$("btn-start").onclick=()=>{
  if(HAS_ROSTER){
    const p=pickedPair();
    if(!p){$("pick").focus();$("s-resume").textContent="先在名单里选到你自己。";return}
    st.cls=p.cls; st.name=p.name;
  }else{
    const n=$("name").value.trim();
    if(!n){$("name").focus();$("name").placeholder="先写名字，老师才知道这是谁的";return}
    st.name=n;
  }
  if(!st.startedAt)st.startedAt=Date.now(); save(); route();
};

/* ===== 路由 ===== */
function route(){
  if(st.li>=LV.length){renderDone();return}
  st.stage==="level"?renderLevel():renderScene();
}
function bars(){
  return LV.map((_,i)=>`<div class="seg ${i<st.li?"on":i===st.li?"now":""}"></div>`).join("");
}

/* ===== 剧情 ===== */
function renderScene(){
  const lv=LV[st.li], sc=sceneOf(lv.sceneId);
  $("bar").innerHTML=bars();
  $("sc-meta").textContent=`${sc.label||""}　${sc.time||""}`.trim();
  $("sc-title").textContent=PACK.episode.title||"";
  $("sc-text").textContent=sc.text||"";
  const c=sc.cliff||lv.title;
  $("sc-cliff").textContent=c; $("sc-cliff").classList.toggle("hide",!c);
  $("sc-locked").classList.remove("hide");
  $("btn-go").textContent=`${lv.title} →`;
  show("v-scene");
}
$("btn-go").onclick=()=>{st.stage="level";save();renderLevel()};

/* ===== 关卡 ===== */
let retryOnly=null;
function qlist(){const lv=LV[st.li];return retryOnly||lv.items}
function renderLevel(){
  const lv=LV[st.li];
  $("bar2").innerHTML=bars();
  $("lv-kind").textContent=KIND[lv.type]||"关卡";
  $("lv-title").textContent=lv.title;
  const ids=qlist();
  $("lv-need").textContent=retryOnly?`把刚才没过的 ${ids.length} 题再做一次。`:`做对 ${Math.min(lv.pass||ids.length,ids.length)} 题，解锁下一幕。`;
  $("qs").innerHTML=ids.map(id=>qhtml(id,IT[id])).join("");
  $("lv-msg").textContent=""; $("lv-after").classList.add("hide"); $("btn-check").classList.remove("hide");
  $("qs").querySelectorAll(".opt[data-v]").forEach(b=>b.onclick=()=>{
    b.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("pick"));
    b.classList.add("pick");
    const inp=document.getElementById("in-"+b.dataset.q); if(inp)inp.value=b.dataset.v;
  });
  show("v-level");
}
function qhtml(id,it){
  if(!it)return"";
  let body="";
  if(it.type==="word")
    body=`<div class="zh">${it.zh}</div>${it.hint?`<div class="tip">${it.hint}</div>`:""}<input id="in-${id}" placeholder="写英文" autocapitalize="off" autocomplete="off" spellcheck="false">`;
  else if(it.type==="cloze")
    body=`<div class="ctx">${(it.context||"").replace(/_{2,}/,"<u></u>")}</div><div class="sub" style="margin-bottom:9px">${it.zh||""}</div>
      <div class="opts">${(it.options||[]).map(o=>`<button class="opt" data-q="${id}" data-v="${o}">${o}</button>`).join("")}</div>
      <input id="in-${id}" class="hide">`;
  else if(it.type==="compose")
    body=`<div class="zh">${it.prompt}</div><div class="sub" style="margin-bottom:9px">必须用上：${(it.must||[]).join("、")}　不少于 ${it.minWords||8} 个词</div><textarea id="in-${id}" placeholder="自己写一句"></textarea>`;
  else if(it.type==="fix")
    body=`<div class="wrongline">${it.wrong}</div><div class="sub" style="margin-bottom:9px">${it.zh||""}</div>
      <input id="in-${id}" placeholder="改对它" autocapitalize="off" spellcheck="false">
      <div class="opts" style="margin-top:9px">${(it.reasons||[]).map(r=>`<button class="opt" data-q="r-${id}" data-v="${r}">${r}</button>`).join("")}</div>
      <input id="in-r-${id}" class="hide">`;
  else
    body=`<div class="zh">${it.zh}</div><textarea id="in-${id}" placeholder="默写整句" autocapitalize="off" spellcheck="false"></textarea>`;
  return `<div class="q" id="q-${id}">${body}<div class="fb" id="fb-${id}"></div></div>`;
}

$("btn-check").onclick=()=>{
  const lv=LV[st.li], ids=qlist();
  let good=0, bad=[];
  ids.forEach(id=>{
    const it=IT[id], inp=$("in-"+id), ans=inp?inp.value:"";
    const v=judge(it,ans);
    let reasonOk=true;
    if(it.type==="fix"){
      const r=$("in-r-"+id)?$("in-r-"+id).value:"";
      reasonOk = r && r===it.reason;
      if(v.r==="pass"&&!reasonOk)v.r="near",v.why=r?"改对了，但错因选错了":"改对了，但没说为什么错";
    }
    st.results[id]={r:v.r,ans:ans.trim(),at:Date.now(),unit:it.unit||PACK.title,
      label:it.en||it.answer||it.zh||id, reason:it.type==="fix"?($("in-r-"+id)||{}).value||"":""};
    const box=$("q-"+id), fb=$("fb-"+id);
    box.className="q "+(v.r==="pass"?"pass":v.r==="fail"?"fail":"near");
    const cls=v.r==="pass"?"pass":v.r==="fail"?"fail":"near";
    const tag={pass:"✓ 对了",near:"≈ 差一点",fail:"✗ 还不会",review:"✓ 已记下"}[v.r];
    const reveal=(v.r!=="pass"&&v.r!=="review")?`<span class="ans">答案：${it.answer||it.en||(it.accept||[])[0]||""}${it.type==="fix"?`（${it.reason}）`:""}</span>`:"";
    fb.className="fb "+cls; fb.innerHTML=`${tag} · ${v.why}${reveal}`;
    if(v.r==="pass"||v.r==="review")good++;else bad.push(id);
  });
  save();
  const need=Math.min(lv.pass||ids.length,ids.length);
  $("btn-check").classList.add("hide"); $("lv-after").classList.remove("hide");
  $("btn-again").classList.toggle("hide",bad.length===0);
  if(good>=need){
    $("lv-msg").textContent=`过了 ${good}/${ids.length} 题，下一幕解锁。`;
    $("btn-next").textContent = st.li+1>=LV.length?"看结算":"看下一幕";
    $("btn-next").onclick=()=>{retryOnly=null;st.li++;st.stage="scene";save();route()};
  }else{
    $("lv-msg").textContent=`过了 ${good}/${ids.length} 题，还差 ${need-good} 题。先把错的再来一次。`;
    $("btn-next").textContent="先往下看（记为未通过）";
    $("btn-next").onclick=()=>{retryOnly=null;st.li++;st.stage="scene";save();route()};
  }
};
$("btn-again").onclick=()=>{
  const ids=qlist().filter(id=>["fail","near"].includes((st.results[id]||{}).r));
  retryOnly=ids.length?ids:null; renderLevel();
};

/* ===== 结算 ===== */
/* 四个数互不重叠，加起来正好等于题数，老师能当场验算。
   造句不算「背对了」—— 系统不判它的对错，它单独进「待老师看」。
   「差一点」也不算「还不会」—— 两个清单分开进飞书，混在一起老师会误判。 */
function tally(){
  const all=LV.flatMap(l=>l.items);
  let pass=0,near=0,fail=0; const review=[],shaky=[],nope=[];
  all.forEach(id=>{
    const r=(st.results[id]||{}).r;
    if(r==="pass")pass++;
    else if(r==="review")review.push(id);
    else if(r==="near"){near++;shaky.push(id)}
    else{fail++;nope.push(id)}
  });
  return{all,pass,near,fail,review,shaky,nope,wrong:nope.concat(shaky)};
}
function renderDone(){
  const t=tally();
  $("d-title").textContent=`${st.name}，${t.fail===0&&t.near===0?"全部背对了":"过完了"}`;
  $("d-sub").textContent=[st.cls,PACK.title,"第 "+((st.sent||0)+1)+" 次",
    "用时 "+Math.max(1,Math.round((Date.now()-(st.startedAt||Date.now()))/60000))+" 分钟"]
    .filter(Boolean).join("　");
  $("d-pass").textContent=t.pass; $("d-near").textContent=t.near;
  $("d-fail").textContent=t.fail; $("d-review").textContent=t.review.length;
  const names=t.wrong.map(shortOf);
  $("d-wrongbox").classList.toggle("hide",!names.length);
  $("d-wrong").innerHTML=names.map(n=>`<li>${n}</li>`).join("");
  $("d-code").textContent=resultCode();
  $("self-opts").querySelectorAll(".opt").forEach(b=>{
    b.classList.toggle("pick",st.self===b.dataset.self);
    b.onclick=()=>{st.self=b.dataset.self;save();$("self-opts").querySelectorAll(".opt").forEach(x=>x.classList.toggle("pick",x===b));$("d-code").textContent=resultCode()};
  });
  const url=(PACK.submit||{}).formUrl;
  $("d-how").textContent=url?"点下面的按钮，再按一下「提交」就交上了，什么都不用填。":"老师还没放提交表单。先复制下面的结果码，发到群里给老师。";
  $("btn-submit").textContent=url?"交作业给老师":"（老师还没开提交入口）";
  $("btn-submit").disabled=!url;
  show("v-done");
}
function payload(){
  const t=tally();
  const secs=Math.round((Date.now()-(st.startedAt||Date.now()))/1000);
  /* 用时偏短只是提示，不是指控：老师自己看一眼就知道那孩子什么情况。 */
  const fast=(secs < t.all.length*8 && t.pass/Math.max(1,t.all.length) > 0.9);
  return{
    cls:st.cls, student:st.name, packId:PACK.packId, attempt:(st.sent||0)+1,
    right:t.pass, shaky:t.near, nope:t.fail, toTeacher:t.review.length,
    nopeList:t.nope.map(shortOf).join("、"),
    shakyList:t.shaky.map(shortOf).join("、"),
    composeText:t.review.map(id=>(st.results[id]||{}).ans||"").filter(Boolean).join(" ｜ "),
    selfRating:st.self||"没选", durationSec:secs, tooFast:fast?"是":"",
    detail:LV.flatMap(l=>l.items).map(id=>id+":"+((st.results[id]||{}).r||"-")).join(",")
  };
}
function resultCode(){
  const p=payload();
  return "BK2|"+[p.cls,p.student,p.packId,p.attempt,p.right,p.shaky,p.nope,p.toTeacher,
                 p.selfRating,p.durationSec,p.tooFast,p.nopeList,p.shakyList,p.detail].join("|");
}
/* 飞书多维表格表单预填：分享链接 + ?prefill_字段名=值，上限 16000 字符。
   每个预填的题再加 hide_字段名=1 藏起来：学生打开表单只看到一个「提交」按钮，
   什么都改不了、也填不错。（2026-11-17 实测 hide_ 有效） */
function buildPrefill(p){
  const cfg=PACK.submit||{}, map=cfg.fieldMap||{};
  if(!cfg.formUrl)return"";
  const mk=obj=>{const u=new URL(cfg.formUrl);
    Object.keys(obj).forEach(k=>{ if(map[k]!=null&&obj[k]!==""){
      u.searchParams.set("prefill_"+map[k],String(obj[k])); u.searchParams.set("hide_"+map[k],"1") } });
    Object.values(map).forEach(f=>{ if(!u.searchParams.has("hide_"+f)) u.searchParams.set("hide_"+f,"1") });  // 空的题也藏
    return u.toString()};
  let s=mk(p);
  if(s.length>15800)s=mk(Object.assign({},p,{detail:"",composeText:""}));   // 太长先丢明细和造句原文
  if(s.length>15800)s=mk({cls:p.cls,student:p.student,packId:p.packId,attempt:p.attempt,
    right:p.right,shaky:p.shaky,nope:p.nope,toTeacher:p.toTeacher,selfRating:p.selfRating});
  return s;
}
function submitUrl(){ return buildPrefill(payload()) }
$("btn-submit").onclick=()=>{
  const s=submitUrl(); if(!s)return;
  st.submitted=true; st.sent=(st.sent||0)+1; save();
  $("d-msg").textContent="成绩已经带过去了，按一下「提交」就行。";
  location.href=s;
};
$("btn-copy").onclick=async()=>{
  const code=resultCode();
  try{await navigator.clipboard.writeText(code);$("d-msg").textContent="复制好了，发到群里给老师。"}
  catch(e){const r=document.createRange();r.selectNodeContents($("d-code"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);$("d-msg").textContent="已选中，长按复制。"}
};
$("btn-retry").onclick=()=>{ if(!confirm("清掉这一包的记录，重新来一遍？"))return;
  const keep={name:st.name,cls:st.cls,sent:st.sent||0};
  localStorage.removeItem(KEY); st=load(); Object.assign(st,keep); save();
  if(HAS_ROSTER)selectCurrent(); else $("name").value=st.name;
  show("v-start") };

/* 启动 */
if(st.name&&(st.li>0||st.stage==="level"))route();else show("v-start");
</script>
</body>
</html>
